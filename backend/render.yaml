services:
  - type: web
    name: hydroponics-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: MQTT_BROKER_URL
        value: mqtts://8218cf51f5de4ac5a776aa0efb931888.s1.eu.hivemq.cloud:8883
      - key: MQTT_USER
        value: tomato-esp32
      - key: MQTT_PASS
        value: tomato_project_Y3
      - key: INFLUX_URL
        value: https://us-east-1-1.aws.cloud2.influxdata.com
      - key: INFLUX_TOKEN
        sync: false
      - key: INFLUX_ORG
        sync: false
      - key: INFLUX_BUCKET
        value: hydroponics
      - key: FRONTEND_URL
        sync: false
